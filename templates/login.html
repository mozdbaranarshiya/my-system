{% extends 'base.html' %}
{% block title %}ورود | سامانه آموزش و پرورش استان اصفهان{% endblock %}
{% block content %}
<div class="login-shell">
  <section class="login-card">
    <div class="login-head">
      <img src="{{ url_for('static', filename='logo.svg') }}" alt="نشان سامانه">
      <h1>سامانه آموزش و پرورش استان اصفهان</h1>
      <p class="muted">ورود مدیر، معلم و دانش‌آموز</p>
    </div>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <p><label>نام کاربری (کدملی)</label><input class="ltr" name="national_id" inputmode="numeric" maxlength="10" autocomplete="username" required></p>
      <p><label>رمز عبور</label><input class="ltr" type="password" name="password" autocomplete="current-password" required></p>
      <button class="btn btn-primary" style="width:100%" type="submit">ورود به سامانه</button>
    </form>
    <p class="muted" style="margin-top:16px;font-size:13px">رمز اولیه هر کاربر همان کدملی اوست. تغییر یا بازنشانی رمز فقط توسط مدیر انجام می‌شود.</p>
  </section>
</div>
{% endblock %}
