{% extends 'base.html' %}
{% block content %}<h1 class="h3 mb-4">پایه، کلاس و درس</h1>
<div class="row g-4">
<div class="col-lg-4"><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5">پایه‌ها</h2><form method="post" action="{{url_for('main.admin_grade_create')}}" class="row g-2 mb-3"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="col-7"><input name="name" class="form-control" placeholder="مثلاً هفتم" required></div><div class="col-3"><input name="sort_order" type="number" class="form-control" value="0"></div><div class="col-2"><button class="btn btn-primary w-100">+</button></div></form>
{% for g in grades %}<div class="border rounded p-2 mb-2"><form method="post" action="{{url_for('main.admin_grade_edit',item_id=g.id)}}" class="row g-1"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="col-6"><input name="name" class="form-control form-control-sm" value="{{g.name}}"></div><div class="col-3"><input name="sort_order" type="number" class="form-control form-control-sm" value="{{g.sort_order}}"></div><div class="col-3"><button class="btn btn-sm btn-outline-primary">ذخیره</button></div></form><form method="post" action="{{url_for('main.admin_grade_delete',item_id=g.id)}}" class="mt-1"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-sm btn-link text-danger p-0">حذف</button></form></div>{% endfor %}
</div></div></div>
<div class="col-lg-4"><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5">کلاس‌ها</h2><form method="post" action="{{url_for('main.admin_class_create')}}" class="row g-2 mb-3"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="col-5"><input name="name" class="form-control" placeholder="نام کلاس" required></div><div class="col-5"><select name="grade_level_id" class="form-select">{% for g in grades %}<option value="{{g.id}}">{{g.name}}</option>{% endfor %}</select></div><div class="col-2"><button class="btn btn-primary w-100">+</button></div></form>
{% for c in classrooms %}<div class="border rounded p-2 mb-2"><form method="post" action="{{url_for('main.admin_class_edit',item_id=c.id)}}" class="row g-1"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="col-5"><input name="name" class="form-control form-control-sm" value="{{c.name}}"></div><div class="col-5"><select name="grade_level_id" class="form-select form-select-sm">{% for g in grades %}<option value="{{g.id}}" {% if c.grade_level_id==g.id %}selected{% endif %}>{{g.name}}</option>{% endfor %}</select></div><div class="col-2"><button class="btn btn-sm btn-outline-primary">✓</button></div></form><div class="small mt-2">نماینده: {{c.representative.full_name if c.representative else 'ندارد'}}</div><form method="post" action="{{url_for('main.admin_set_representative',classroom_id=c.id)}}" class="d-flex gap-1 mt-1"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><select name="student_id" class="form-select form-select-sm"><option value="">بدون نماینده</option>{% for p in c.students %}<option value="{{p.user.id}}" {% if c.representative_student_id==p.user.id %}selected{% endif %}>{{p.user.full_name}}</option>{% endfor %}</select><button class="btn btn-sm btn-outline-secondary">ثبت</button></form><form method="post" action="{{url_for('main.admin_class_delete',item_id=c.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-sm btn-link text-danger p-0 mt-1">حذف</button></form></div>{% endfor %}
</div></div></div>
<div class="col-lg-4"><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5">درس‌ها</h2><form method="post" action="{{url_for('main.admin_subject_create')}}" class="row g-2 mb-3"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="col-5"><input name="name" class="form-control" placeholder="نام درس" required></div><div class="col-5"><select name="grade_level_id" class="form-select">{% for g in grades %}<option value="{{g.id}}">{{g.name}}</option>{% endfor %}</select></div><div class="col-2"><button class="btn btn-primary w-100">+</button></div></form>
{% for s in subjects %}<div class="border rounded p-2 mb-2"><form method="post" action="{{url_for('main.admin_subject_edit',item_id=s.id)}}" class="row g-1"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="col-5"><input name="name" class="form-control form-control-sm" value="{{s.name}}"></div><div class="col-5"><select name="grade_level_id" class="form-select form-select-sm">{% for g in grades %}<option value="{{g.id}}" {% if s.grade_level_id==g.id %}selected{% endif %}>{{g.name}}</option>{% endfor %}</select></div><div class="col-2"><button class="btn btn-sm btn-outline-primary">✓</button></div></form><form method="post" action="{{url_for('main.admin_subject_delete',item_id=s.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-sm btn-link text-danger p-0 mt-1">حذف</button></form></div>{% endfor %}
</div></div></div>
</div>{% endblock %}
