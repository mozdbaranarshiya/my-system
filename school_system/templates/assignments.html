{% extends 'base.html' %}{% block content %}<h1 class="h3 mb-4">تخصیص معلم به کلاس و درس</h1>
<div class="card border-0 shadow-sm mb-4"><div class="card-body"><form method="post" action="{{url_for('main.admin_assignment_create')}}" class="row g-2"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="col-md-4"><select name="teacher_id" class="form-select" required><option value="">معلم</option>{% for t in teachers %}<option value="{{t.id}}">{{t.full_name}}</option>{% endfor %}</select></div><div class="col-md-3"><select name="classroom_id" class="form-select" required><option value="">کلاس</option>{% for c in classrooms %}<option value="{{c.id}}">{{c.grade_level.name}} - {{c.name}}</option>{% endfor %}</select></div><div class="col-md-3"><select name="subject_id" class="form-select" required><option value="">درس</option>{% for s in subjects %}<option value="{{s.id}}">{{s.grade_level.name}} - {{s.name}}</option>{% endfor %}</select></div><div class="col-md-2"><button class="btn btn-primary w-100">ثبت تخصیص</button></div></form></div></div>
<div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>معلم</th><th>پایه</th><th>کلاس</th><th>درس</th><th></th></tr></thead><tbody>{% for a in assignments %}<tr><td>{{a.teacher.full_name}}</td><td>{{a.classroom.grade_level.name}}</td><td>{{a.classroom.name}}</td><td>{{a.subject.name}}</td><td><form method="post" action="{{url_for('main.admin_assignment_delete',item_id=a.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-sm btn-outline-danger">حذف</button></form></td></tr>{% else %}<tr><td colspan="5" class="text-center text-secondary">تخصیصی ثبت نشده است.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
